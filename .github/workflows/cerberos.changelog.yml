name: Cerberos - Changelog

on:
  push:
    # Run when any tag is created.
    tags:
      - '*'

jobs:
  cerberos-changelog:
    # Inherit secrets makes sure we use the secrets from this workflow in the called workflow
    secrets: inherit
    uses: cerberos-dev/cerberos-internal/.github/workflows/cerberos.changelog.yml@1.0.7
