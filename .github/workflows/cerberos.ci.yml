name: Cerberos - Laravel CI

on:
  pull_request:
    # Run on PR's for master when Opened, Reopened or Synchronized.
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

jobs:
  cerberos-laravel-ci:
    strategy:
      matrix:
        php-version: [8.2]
        node-version: [22]

    # Inherit secrets makes sure we use the secrets from this workflow in the called workflow
    secrets: inherit
    uses: cerberos-dev/cerberos-internal/.github/workflows/cerberos.laravel-ci.yml@1.0.7
    with:
      php-version: ${{ matrix.php-version }}
      node-version: ${{ matrix.node-version }}
